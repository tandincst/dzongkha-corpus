name: Validate corpus

on:
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Check submissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check corpus files
        run: python scripts/validate.py

      - name: Run tests for the checker
        run: python -m pytest -q tests
